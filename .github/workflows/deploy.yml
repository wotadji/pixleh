name: Deploy

# Se déclenche uniquement après un succès du workflow CI sur main (jamais sur une PR,
# jamais si lint/typecheck/tests/build ont échoué) — voir ci.yml. Déploie par SSH/rsync
# vers l'hébergement cPanel (accès Terminal confirmé), pas de plateforme serverless :
# server.js est un serveur Node persistant pensé pour Passenger/cPanel (voir README).
#
# Authentification par mot de passe (pas par clé) : le panel SSH de l'hébergeur
# (cloudlogin.co) ne propose que "Générer un mot de passe", pas de gestion de clés
# SSH — voir SSH_PASSWORD dans les secrets du repo GitHub.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Filet de sécurité manuel : le déclenchement automatique via workflow_run s'est
  # révélé instable sur ce repo (voir incident du 07/08/2026 — CI se déclenchait avec
  # un fort délai, et Deploy ne s'est pas enchaîné après un run CI pourtant réussi).
  # Permet de lancer un déploiement à la demande depuis l'onglet Actions → Deploy →
  # "Run workflow", sans dépendre du chaînage automatique.
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Vérifier que le chemin de déploiement est configuré
        run: |
          if [ -z "${{ secrets.SSH_APP_PATH }}" ]; then
            echo "::error::SSH_APP_PATH n'est pas configuré (secret vide) — abandon du déploiement pour éviter d'écraser le mauvais dossier (rsync --delete vers un chemin vide écrirait dans le répertoire personnel du compte SSH)."
            exit 1
          fi
          if [ -z "${{ secrets.SSH_APP_PORT }}" ]; then
            echo "::error::SSH_APP_PORT n'est pas configuré (secret vide) — sans lui server.js retombe sur le port 3000 par défaut (EACCES sur ce compte, boucle de crash), voir commentaire dans l'étape pm2 ci-dessous."
            exit 1
          fi

      - name: Installer les dépendances (pour build le .next ici, pas sur le serveur mutualisé)
        run: npm ci

      - name: Build de production
        run: npm run build
        env:
          # Factices : ce build ne sert qu'à produire le dossier .next à envoyer sur le
          # serveur. La vraie DATABASE_URL/NEXTAUTH_SECRET de prod vivent uniquement dans
          # le .env du serveur (jamais dans GitHub) — voir l'étape SSH plus bas.
          DATABASE_URL: "postgresql://build:build@localhost:5432/build"
          NEXTAUTH_SECRET: "build-placeholder"
          NEXTAUTH_URL: "https://placeholder.invalid"

      - name: Envoyer les fichiers sur le serveur (rsync via SSH, mot de passe)
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          sshpass -e rsync -avzr --delete \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="node_modules" \
            --exclude=".env" \
            --exclude=".env.example" \
            --exclude="storage" \
            --exclude="tsconfig.tsbuildinfo" \
            --exclude=".htaccess" \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_APP_PATH }}"

      - name: Installer les dépendances de prod, appliquer le schéma, redémarrer l'app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            # Une session SSH non-interactive (comme celle-ci) ne charge pas le même
            # PATH que le terminal Web SSH interactif du panel — sans ça, "node"/"npm"
            # retombent sur une très vieille version par défaut du compte. On force
            # explicitement le bon chemin (confirmé via `which node`/`which npm` sur
            # l'instance UAT — à revérifier si l'instance prod utilise un autre chemin).
            # v20.0.0 (ancienne version par défaut du compte) ne satisfait pas la
            # contrainte de "sharp" (^20.3.0 minimum) — utiliser v20.19.0.
            export PATH="/home/.nvm/versions/node/v20.19.0/bin:$PATH"
            cd "${{ secrets.SSH_APP_PATH }}"
            node -v
            npm -v
            # Le "NodeJS Selector" du panel (Passenger-like) ne redémarre pas réellement
            # l'app sur cet hébergement (Hepsia/cloudlogin) : touch tmp/restart.txt n'a
            # aucun effet ici (bug découvert le 04/08/2026 lors du premier déploiement prod
            # — l'app tournait toujours avec l'ancien code/l'ancien .env de l'UAT après un
            # rsync réussi, provoquant des redirections vers l'ancien sous-domaine UAT lors
            # du login). On gère donc le process nous-mêmes avec pm2, comme pour l'UAT.
            command -v pm2 >/dev/null 2>&1 || npm install -g pm2
            # L'instance Node.js unique de ce compte (limite du plan) a été réaffectée de
            # l'UAT vers la prod le 04/08/2026 : on tue l'ancien process pixleh-uat s'il
            # tourne encore (même port), en plus du process prod lui-même s'il existe déjà.
            pm2 delete pixleh-uat 2>/dev/null || true
            pm2 delete pixleh-prod 2>/dev/null || true
            npm ci --omit=dev
            npx prisma generate
            # Le projet n'a pas d'historique de migrations Prisma (prisma/migrations
            # n'existe pas) : le schéma a toujours été appliqué via `db push`, pas
            # `migrate deploy`. En CI non interactif, `db push` échoue plutôt que
            # d'appliquer silencieusement un changement destructeur — comportement voulu.
            npx prisma db push
            # server.js lit process.env.PORT AVANT que Next.js ne charge le .env (ligne 16,
            # bien avant app.prepare()) — le PORT du .env est donc ignoré à ce stade. Il faut
            # l'exporter explicitement ici, comme pour l'UAT (bug découvert le 04/08/2026 :
            # sans ça, l'app retombe sur le port 3000 par défaut, EACCES sur ce compte, boucle
            # de crash pm2).
            export PORT="${{ secrets.SSH_APP_PORT }}"
            export NODE_ENV=production
            pm2 start server.js --name pixleh-prod
            pm2 save
